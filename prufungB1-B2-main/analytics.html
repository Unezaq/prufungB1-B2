<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TELC Prep — Analytics</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<link rel="stylesheet" href="/app.css"/>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="mobile-nav" id="mobileNav"></div>
    <div class="topbar"><div><h1>Performance Analytics</h1><div class="subtitle">Real data from your attempts</div></div></div>
    <div class="grid grid-2" style="margin-bottom:16px;">
      <div class="glass card">
        <h2>Accuracy by Category (B1)</h2>
        <canvas id="chartB1" class="chart-wrap" style="width:100%;height:220px;"></canvas>
      </div>
      <div class="glass card">
        <h2>Accuracy by Category (B2)</h2>
        <canvas id="chartB2" class="chart-wrap" style="width:100%;height:220px;"></canvas>
      </div>
    </div>
    <div class="glass card">
      <h2>Attempt History</h2>
      <div id="historyBox" class="empty"><i class="fas fa-chart-line"></i><div>No attempts yet.</div></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
<script>
(async function(){
  await loadRegistry();
  renderSidebar('analytics'); renderMobileNav('analytics');
  const stats = computeStats();
  // B1
  const dataB1 = {};
  Object.keys(stats.byCat).filter(k=>k.startsWith('B1')).forEach(k=>{
    const short = k.replace('B1 · ','');
    dataB1[short] = stats.byCat[k].accuracy;
  });
  drawBarChart(document.getElementById('chartB1'), dataB1);
  const dataB2 = {};
  Object.keys(stats.byCat).filter(k=>k.startsWith('B2')).forEach(k=>{
    const short = k.replace('B2 · ','');
    dataB2[short] = stats.byCat[k].accuracy;
  });
  drawBarChart(document.getElementById('chartB2'), dataB2);

  const recent = stats.attempts.slice().reverse();
  if (recent.length) {
    const box = document.getElementById('historyBox');
    box.classList.remove('empty');
    box.innerHTML = `<table class="table"><thead><tr><th>Quiz</th><th>Level</th><th>Category</th><th>Score</th><th>Date</th></tr></thead><tbody>
      ${recent.map(a=>`<tr><td>${a.title}</td><td>${a.level}</td><td>${a.category}</td><td>${a.score}/${a.total}</td><td>${new Date(a.date).toLocaleString()}</td></tr>`).join('')}
    </tbody></table>`;
  }
  window.addEventListener('resize', ()=>{ drawBarChart(document.getElementById('chartB1'), dataB1); drawBarChart(document.getElementById('chartB2'), dataB2); });
})();
</script>
</body>
</html>
