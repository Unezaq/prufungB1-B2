<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TELC Prep — Mistake Notebook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<link rel="stylesheet" href="/app.css"/>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="mobile-nav" id="mobileNav"></div>
    <div class="topbar">
      <div><h1>Mistake Notebook</h1><div class="subtitle">Learn from your incorrect answers</div></div>
      <div style="display:flex;gap:8px;">
        <select class="select" id="lvlFilter" style="width:120px;"><option value="all">All levels</option><option value="B1">B1</option><option value="B2">B2</option></select>
        <button class="btn danger" id="clearBtn"><i class="fas fa-trash"></i> Clear all</button>
      </div>
    </div>
    <div id="content"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
<script>
(async function(){
  await loadRegistry();
  renderSidebar('mistakes'); renderMobileNav('mistakes');
  function render() {
    const lvl = document.getElementById('lvlFilter').value;
    let ms = Store.getMistakes();
    if (lvl !== 'all') ms = ms.filter(m=>m.level===lvl);
    const box = document.getElementById('content');
    if (!ms.length) { box.innerHTML = '<div class="empty"><i class="fas fa-check-circle"></i><div>No mistakes saved yet. Complete quizzes to populate this notebook.</div></div>'; return; }
    box.innerHTML = ms.slice().reverse().map(m=>`
      <div class="glass card" style="margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;align-items:start;gap:10px;flex-wrap:wrap;">
          <div>
            <div style="font-weight:600;">${m.question || '(question)'}</div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">${m.title} · ${m.level} · ${m.category}</div>
          </div>
          <span class="badge">${new Date(m.date).toLocaleDateString()}</span>
        </div>
        <div style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div style="padding:8px;border-radius:8px;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);">
            <div style="font-size:11px;color:#fecaca;">Your answer</div>
            <div style="font-weight:600;">${m.studentAnswer || '-'}</div>
          </div>
          <div style="padding:8px;border-radius:8px;background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.3);">
            <div style="font-size:11px;color:#bbf7d0;">Correct answer</div>
            <div style="font-weight:600;">${m.correctAnswer || '-'}</div>
          </div>
        </div>
      </div>
    `).join('');
  }
  document.getElementById('lvlFilter').addEventListener('change', render);
  document.getElementById('clearBtn').onclick = () => { if(confirm('Clear all mistakes?')) { localStorage.setItem('telc_mistakes','[]'); render(); toast('Cleared'); } };
  render();
})();
</script>
</body>
</html>
